name: CardStory Android V2.0 Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CARDSTORY_KEYSTORE_BASE64: ${{ secrets.CARDSTORY_KEYSTORE_BASE64 }}
      CARDSTORY_STORE_PASSWORD: ${{ secrets.CARDSTORY_STORE_PASSWORD }}
      CARDSTORY_KEY_ALIAS: ${{ secrets.CARDSTORY_KEY_ALIAS }}
      CARDSTORY_KEY_PASSWORD: ${{ secrets.CARDSTORY_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CardStory-V2.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Prepare release signing key
        if: ${{ env.CARDSTORY_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$CARDSTORY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cardstory-release.jks"
          echo "CARDSTORY_KEYSTORE_PATH=$RUNNER_TEMP/cardstory-release.jks" >> "$GITHUB_ENV"
      - name: Verify release secrets exist
        if: ${{ env.CARDSTORY_KEYSTORE_BASE64 != '' }}
        run: |
          test -n "$CARDSTORY_STORE_PASSWORD"
          test -n "$CARDSTORY_KEY_ALIAS"
          test -n "$CARDSTORY_KEY_PASSWORD"
      - name: Build signed release APK
        if: ${{ env.CARDSTORY_KEYSTORE_BASE64 != '' }}
        run: gradle --no-daemon assembleRelease
      - name: Upload signed release APK
        if: ${{ env.CARDSTORY_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: CardStory-V2.0-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
