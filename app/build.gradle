plugins { id 'com.android.application' }

android {
    namespace 'com.cardstory.game'
    compileSdk 35
    defaultConfig {
        applicationId 'com.cardstory.game'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '2.0'
    }

    // Release signing is supplied securely by GitHub Actions environment variables.
    // Never commit the keystore or passwords into the repository.
    signingConfigs {
        release {
            def ksPath = System.getenv('CARDSTORY_KEYSTORE_PATH')
            if (ksPath != null && !ksPath.isBlank()) {
                storeFile file(ksPath)
                storePassword System.getenv('CARDSTORY_STORE_PASSWORD')
                keyAlias System.getenv('CARDSTORY_KEY_ALIAS')
                keyPassword System.getenv('CARDSTORY_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv('CARDSTORY_KEYSTORE_PATH') != null && !System.getenv('CARDSTORY_KEYSTORE_PATH').isBlank()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }
}
